name: Dre Tournament Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *" # runs every 20 minutes. Make sure to skip already forecasted questions!

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Ensure forecast summaries directory exists
        if: always()
        run: mkdir -p forecast_summaries
      - name: Write step summary from diagnostics
        if: always()
        run: |
          if [ -f forecast_summaries/run_diagnostics.json ]; then
            python3 -c "
          import json, os
          with open('forecast_summaries/run_diagnostics.json') as f:
              diag = json.load(f)
          s = diag.get('summary', {})
          lines = []
          lines.append('## Forecast Run Diagnostics')
          lines.append(f'**Run time:** {diag.get(\"run_timestamp\", \"unknown\")}')
          lines.append('')
          lines.append('| Metric | Count |')
          lines.append('|--------|-------|')
          lines.append(f'| Open questions from API | {s.get(\"total_open_questions\", 0)} |')
          lines.append(f'| Already forecasted (skipped) | {s.get(\"total_already_forecasted\", 0)} |')
          lines.append(f'| Attempted | {s.get(\"total_attempted\", 0)} |')
          lines.append(f'| Successes | {s.get(\"total_successes\", 0)} |')
          lines.append(f'| Failures | {s.get(\"total_failures\", 0)} |')
          lines.append('')
          for t in diag.get('tournaments', []):
              lines.append(f'### Tournament: {t[\"tournament_id\"]}')
              lines.append(f'Questions: {t[\"total_open_questions\"]} | Types: {t[\"by_type\"]}')
              lines.append(f'Skipped: {t[\"already_forecasted\"]} | Attempted: {t[\"attempted\"]}')
              results = t.get('results', {})
              successes = results.get('successes', [])
              failures = results.get('failures', [])
              if successes:
                  lines.append(f'**Successes ({len(successes)}):**')
                  for sc in successes:
                      lines.append(f'- Q{sc[\"question_id\"]} [{sc[\"question_type\"]}]')
              if failures:
                  lines.append(f'**Failures ({len(failures)}):**')
                  for fl in failures:
                      lines.append(f'- {fl[\"type\"]}: {fl[\"message\"][:200]}')
              lines.append('')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n'.join(lines))
          "
          else
            echo "No diagnostics file found" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload forecast summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-summaries-${{ github.run_number }}
          path: forecast_summaries/
          retention-days: 90
          if-no-files-found: warn
